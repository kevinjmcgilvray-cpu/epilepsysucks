  <script>
    // Mermaid.js itself (~900KB) is loaded lazily, only once the timeline
    // diagram is about to scroll into view (or the "Behind the code"
    // architecture <details> is opened) — not on every single page load.
    //
    // Exposed so app.js can re-initialize + re-render diagrams when the
    // light/dark toggle is clicked (mermaid doesn't auto-theme itself).
    window.applyMermaidTheme = function () {
      if (!window.mermaid) return;
      var isLightTheme = document.documentElement.getAttribute("data-theme") === "light";
      mermaid.initialize({
        startOnLoad: false,
        theme: isLightTheme ? "default" : "dark",
        themeVariables: isLightTheme
          ? {
              darkMode: false,
              background: "#faf7f2",
              primaryColor: "#e4d9ff",
              primaryTextColor: "#1c1915",
              primaryBorderColor: "#6d3fe8",
              lineColor: "#6d3fe8",
              secondaryColor: "#ddd2c8",
              tertiaryColor: "#e2dbd0",
              fontFamily: "DM Sans, sans-serif",
              fontSize: "18px"
            }
          : {
              darkMode: true,
              background: "#14110f",
              primaryColor: "#211c2e",
              primaryTextColor: "#ebe4d8",
              primaryBorderColor: "#9b6bff",
              lineColor: "#9b6bff",
              secondaryColor: "#211714",
              tertiaryColor: "#1a1613",
              fontFamily: "DM Sans, sans-serif",
              fontSize: "18px"
            }
      });
    };
  </script>
